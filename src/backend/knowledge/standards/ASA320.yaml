# text 为该段原文, 去掉段号与 (Ref: Para. ...) 交叉引用, 列举项各占一行
standard: ASA 320
title: Materiality in Planning and Performing an Audit
compiled: "2023-12-14"   # Compilation Number 4
fragments:
  - id: ASA320-P10
    paragraph: "10"
    topic: overall_materiality
    text: |
      When establishing the overall audit strategy, the auditor shall determine materiality for the financial report as a whole. If, in the specific circumstances of the entity, there is one or more particular classes of transactions, account balances or disclosures for which misstatements of lesser amounts than materiality for the financial report as a whole could reasonably be expected to influence the economic decisions of users taken on the basis of the financial report, the auditor shall also determine the materiality level or levels to be applied to those particular classes of transactions, account balances or disclosures.
    procedures: [PLN-01]
  - id: ASA320-P11
    paragraph: "11"
    topic: performance_materiality
    text: |
      The auditor shall determine performance materiality for purposes of assessing the risks of material misstatement and determining the nature, timing and extent of further audit procedures.
    procedures: [PLN-01]
  - id: ASA320-P12
    paragraph: "12"
    topic: revise_materiality
    text: |
      The auditor shall revise materiality for the financial report as a whole (and, if applicable, the materiality level or levels for particular classes of transactions, account balances or disclosures) in the event of becoming aware of information during the audit that would have caused the auditor to have determined a different amount (or amounts) initially.
    procedures: [PLN-19]
  - id: ASA320-P13
    paragraph: "13"
    topic: lower_materiality_consequences
    text: |
      If the auditor concludes that a lower materiality for the financial report as a whole (and, if applicable, materiality level or levels for particular classes of transactions, account balances or disclosures) than that initially determined is appropriate, the auditor shall determine whether it is necessary to revise performance materiality, and whether the nature, timing and extent of the further audit procedures remain appropriate.
    procedures: [PLN-19]
