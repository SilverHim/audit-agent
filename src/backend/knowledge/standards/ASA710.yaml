standard: ASA 710
title: Comparative Information-Corresponding Figures and Comparative Financial Reports
compiled: "2023-03-22"   # Compilation number 5
fragments:
  - id: ASA710-P14
    paragraph: "14"
    topic: prior_period_unaudited
    text: |
      If the prior period financial report was not audited, the auditor shall state in an Other Matter paragraph in the auditor’s report that the corresponding figures are unaudited. Such a statement does not, however, relieve the auditor of the requirement to obtain sufficient appropriate audit evidence that the opening balances do not contain misstatements that materially affect the current period’s financial report.
    procedures: [PLN-15]
