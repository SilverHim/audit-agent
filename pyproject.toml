[project]
name = "elec5620-audit"
version = "0.1.0"
description = "基于大语言模型的多智能体审计支持系统（ELEC5620 Group 16）"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pdfplumber>=0.11.10",
    "psycopg[binary,pool]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["src/backend/migrations", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 允许中文全角标点
    "RUF012",  # Pydantic 模型的可变默认值会被复制
    "UP046", "UP047",  # 与接口文档一致, 沿用 TypeVar 写法
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["src/backend/migrations/"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not slow'"  # 慢测试用 uv run pytest -m slow 显式运行
markers = ["slow: 连数据库或调真实 LLM，平时不跑"]
