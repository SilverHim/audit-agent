# text 为该段原文, 去掉段号与 (Ref: Para. ...) 交叉引用, 列举项各占一行
standard: ASA 450
title: Evaluation of Misstatements Identified during the Audit
compiled: "2017-09-14"   # Compilation no. 2
fragments:
  - id: ASA450-P05
    paragraph: "5"
    topic: accumulate_misstatements
    text: |
      The auditor shall accumulate misstatements identified during the audit, other than those that are clearly trivial.
    procedures: [PLN-01, FIN-04, CSH-02]
  - id: ASA450-P11
    paragraph: "11"
    topic: evaluate_uncorrected
    text: |
      The auditor shall determine whether uncorrected misstatements are material, individually or in aggregate. In making this determination, the auditor shall consider:
      (a) The size and nature of the misstatements, both in relation to particular classes of transactions, account balances or disclosures and the financial report as a whole, and the particular circumstances of their occurrence; and
      (b) The effect of uncorrected misstatements related to prior periods on the relevant classes of transactions, account balances or disclosures, and the financial report as a whole.
    procedures: [FIN-01]
