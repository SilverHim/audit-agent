id: FIN-04
name: 错报累计
workpaper: {ref: X, area: X}  # 底稿索引号与所属区 (需求 R329, knowledge/workpapers.yaml)
scope:
  zh: 本项目当前的全部错报
  en: All current misstatements of the engagement
phase: P3_Completion
cycle: Completion
owner: A9
outputs: [uncorrected_schedule]
engine: rule
autonomy_level: L3
params:
  materiality_cents: {ref: materiality_cents}
  performance_materiality_cents: {ref: performance_materiality_cents}  # AI 建议为错报但未认定一节的金额档位 (需求 R363)
  clearly_trivial_cents: {ref: clearly_trivial_cents}
# 错报分类 FIN-03 与更正验证 FIN-09 之后 (都属功能 misstatement; 关闭时程序库丢弃这两条依赖)
depends_on: [FIN-03, FIN-09]
standards: [ASA450-P05]
# 无 SQL, A9 从 state.misstatements (当前结果) 按错报状态计算 UncorrectedSchedule (需求 R166, 规格书 12.3 子状态机注):
# - 累计额: uncorrected 取 amount_cents, partially_corrected 取 residual_cents; 累计额 > clearly_trivial_cents 的进 items
#   (带 direction 与 origin), 其余的 id 进 excluded_trivial_ids; corrected 的 id 进 corrected_ids
# - 还有 identified, communicated, verifying (或本版不写的 evaluated, closed) 的错报时执行失败, 转人工 (兜底: 正常拓扑下
#   完成阶段认定的错报都经回流结清); 功能 misstatement 关闭时错报一律为 uncorrected, 结果同原口径
# - total_cents = items 的 amount_cents 之和, 不按 direction 抵销
# - materiality_cents 取 params; total_cents >= materiality_cents 时 candidate_opinion = qualified, 否则 unqualified
#   (services.opinion.allowed_opinions, 需求 R184)
# - unrecognised (需求 R363, agents/qc.unrecognised_suggestions): 当前结果中 AI 建议为错报而已复核, 却没有认定出错报的
#   判断, 带草稿金额, 方向与复核人; 金额档位对明显微小, 执行重要性与整体重要性; 只提示, 不计入合计与候选意见
rules: []
