id: PLN-07
name: 初步分析程序
phase: P1_Planning
cycle: Planning
owner: A4
outputs: [analytics, exceptions]
reads: [accounts, trial_balance, journal_entries]
engine: rule
autonomy_level: L3
params:
  change_pct: 0.2                 # 变动不小于期初 (比较基数) 绝对值的这一比例
  min_change_revenue_pct: 0.005   # 变动不小于本期收入乘以这一比例 (Numbat 收入 12,000,000.00 时为 60,000.00)
  revenue_categories: [revenue]              # 收入取这些标准分类 (accounts.category): A01 的门槛, 毛利率, 收入增长率
  cost_of_sales_categories: [cost_of_sales]  # 毛利率的成本取这些标准分类
  employee_expense_categories: [employee_expenses]  # A03 月度员工费用取这些标准分类
  period_start: {ref: period_start}
  period_end: {ref: period_end}
  prior_period_start: {ref: dataset.prior_period_start}  # 上期起始日 (数据集声明); 为空视为与本期等长
rules:
  # A01 (设计稿 v2.1 第 5.1 节, 决定 9): 两期试算表出现过的科目逐个比较本期末与比较基数.
  # - 资产负债类 (asset, liability, equity) 对期初: 期初 = 上期末余额; 上期损益结转进留存收益, 所以 category 为
  #   retained_earnings 的代码最小科目的期初再加上期全部损益类 (revenue, expense) 余额之和.
  # - 损益类只在本期与上期等长时比较, 基数为上期余额. 上期截止日 = 本期起始日前一天; 等长按整月数判定 (上期起始日
  #   加本期的整月数等于本期起始日), 避免闰年 365/366 天把 12 个月的两期误判为不等长; 上期起始日为空视为等长.
  # - 命中: 变动不为 0, |变动| ≥ min_change_revenue_pct × 本期收入 (取正), 且 |变动| ≥ change_pct × |基数|.
  - id: A01
    name: 科目本期末与期初变动超阈值
    severity: medium
    sql: |
      WITH balances AS (
       SELECT a.code, a.name, a.type, a.category,
              SUM(t.balance_cents) FILTER (WHERE t.period='current') AS current_cents,
              SUM(t.balance_cents) FILTER (WHERE t.period='prior') AS prior_cents
       FROM trial_balance t JOIN accounts a ON a.engagement_id=t.engagement_id AND a.code=t.account_code
       WHERE t.engagement_id=:eid
       GROUP BY a.code, a.name, a.type, a.category),
      revenue AS (
       SELECT ABS(COALESCE(SUM(current_cents) FILTER (WHERE category=ANY(:revenue_categories)),0)) AS cents
       FROM balances),
      carried AS (
       SELECT (SELECT MIN(code) FROM balances WHERE category='retained_earnings') AS code,
              COALESCE((SELECT SUM(prior_cents) FROM balances WHERE type IN ('revenue','expense')),0) AS cents),
      span AS (
       SELECT age(CAST(:period_end AS date)+1, CAST(:period_start AS date)) AS length),
      same_length AS (
       SELECT CAST(:prior_period_start AS date) IS NULL
              OR CAST(:prior_period_start AS date)
                 + make_interval(months => CAST(EXTRACT(YEAR FROM length)*12+EXTRACT(MONTH FROM length) AS int))
                 = CAST(:period_start AS date) AS ok
       FROM span),
      compared AS (
       SELECT b.code, b.name, b.current_cents, b.prior_cents,
              CASE WHEN b.type IN ('revenue','expense') THEN 'profit_or_loss' ELSE 'balance_sheet' END AS basis,
              COALESCE(b.prior_cents,0)+CASE WHEN b.code=c.code THEN c.cents ELSE 0 END AS opening_cents
       FROM balances b, carried c, same_length s
       WHERE b.type IN ('asset','liability','equity') OR (b.type IN ('revenue','expense') AND s.ok))
      SELECT 'trial_balance' AS source_type, x.code AS source_id,
             COALESCE(x.current_cents,0)-x.opening_cents AS amount_cents,
             x.name AS account_name, x.basis, x.current_cents, x.prior_cents, x.opening_cents,
             CAST(COALESCE(x.current_cents,0)-x.opening_cents AS numeric)/NULLIF(ABS(x.opening_cents),0) AS change_pct
      FROM compared x, revenue r
      WHERE COALESCE(x.current_cents,0)-x.opening_cents<>0
       AND ABS(COALESCE(x.current_cents,0)-x.opening_cents)>=:min_change_revenue_pct*r.cents
       AND ABS(COALESCE(x.current_cents,0)-x.opening_cents)>=:change_pct*ABS(x.opening_cents)
      ORDER BY source_id
  - id: A02
    name: 比率计算取数
    severity: low
    emit: rows
    sql: |
      SELECT t.period,
       COALESCE(-SUM(t.balance_cents) FILTER (WHERE a.category=ANY(:revenue_categories)),0) AS revenue_cents,
       COALESCE(SUM(t.balance_cents) FILTER (WHERE a.category=ANY(:cost_of_sales_categories)),0) AS cost_of_sales_cents
      FROM trial_balance t JOIN accounts a ON a.engagement_id=t.engagement_id AND a.code=t.account_code
      WHERE t.engagement_id=:eid GROUP BY t.period ORDER BY t.period
  # A03 (设计稿 v2.1 第 5.1 节 PLN-07 新增行, 决定 9): 本期内按月汇总总账分录 (入账日期在审计期间内), 供闸门查看,
  # 也供后续程序读月度数; 不出例外. 收入 = revenue_categories 的贷减借; 费用 = 类型 expense 的借减贷; 员工费用 =
  # employee_expense_categories 的借减贷 (含在费用里). month 为月初日期, 审计期间的每个月都出一行, 按月升序; 没有
  # 分录的月份三项为 0 (整月缺分录要看得出来). 月份按不带时区的 timestamp 算, 与会话时区无关.
  - id: A03
    name: 月度趋势取数
    severity: low
    emit: rows
    sql: |
      WITH months AS (
       SELECT CAST(m AS date) AS month
       FROM generate_series(date_trunc('month', CAST(:period_start AS timestamp)), CAST(:period_end AS timestamp),
                            interval '1 month') AS m),
      sums AS (
       SELECT CAST(date_trunc('month', CAST(j.posting_date AS timestamp)) AS date) AS month,
              SUM(j.credit_cents-j.debit_cents) FILTER (WHERE a.category=ANY(:revenue_categories)) AS revenue_cents,
              SUM(j.debit_cents-j.credit_cents) FILTER (WHERE a.type='expense') AS expense_cents,
              SUM(j.debit_cents-j.credit_cents) FILTER (WHERE a.category=ANY(:employee_expense_categories))
               AS employee_expense_cents
       FROM journal_entries j JOIN accounts a ON a.engagement_id=j.engagement_id AND a.code=j.account_code
       WHERE j.engagement_id=:eid
        AND j.posting_date BETWEEN CAST(:period_start AS date) AND CAST(:period_end AS date)
       GROUP BY 1)
      SELECT m.month, COALESCE(s.revenue_cents,0) AS revenue_cents, COALESCE(s.expense_cents,0) AS expense_cents,
             COALESCE(s.employee_expense_cents,0) AS employee_expense_cents
      FROM months m LEFT JOIN sums s ON s.month=m.month
      ORDER BY m.month
