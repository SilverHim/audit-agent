# 审计报告的固定部分, 按工作语言 (zh, en) 各一份, 结构相同 (需求 R341): 意见段与形成意见的基础段首行的标题 (headings,
# RPT-03 的提示词与校验同取这里), 报告中的日期写法 (date), 模型写两段时用的名称 (terms, 与固定段落的写法相同, 提示词
# 要求照写), 拼在模型写的两段之后的固定段落 (sections, 每段首行为标题, 签名块除外). RPT-03 按执行记录的语言取
# (ProcedureRun.language). 载入时核对: 两种语言的意见类型, 段落, 标题与名称的键相同, 标题与名称不为空, 各段的占位符
# 相同 (procedure_library.report_templates).
# 英文底本: ASA 700 [Aus] Illustration 1A (docs/参考资料/ 的 ASA 700 编译版第 41-42 页), 照录;
# ASA 705 [Aus] Illustration 1A 的这几段写明 "按 ASA 700 Illustration 1A", 所以保留意见与无保留意见用同一份 (&en, &zh).
# Numbat 不是上市公司: 去掉关键审计事项, 其他信息, 薪酬报告 (s300A 只适用于上市公司);
# 审计师责任段去掉 ASA 700 第 40(b) 段 (向治理层声明独立性, 只用于上市主体) 与第 40(c) 段 (关键审计事项);
# 不用 "说明见 AUASB 网站" 的写法, 按第 41(a) 段写在报告正文里.
# other_legal_and_regulatory 留空, 签名块放 signature (Q14 选项 2).
# 签名块按 ASA 700 Illustration 1A 末尾 (审计师姓名与签字, 事务所, 地址), 报告日见 AuditReportVersion.report_date;
# 事务所与地址取合成数据集设计第 6.4 节回函的收件人.
# 中文: 按上述英文逐段译出 (Q28 推荐项 1, 自译, 不是官方文本; 段号对照见确认材料 R341.md, 待用户核定措辞), 不加减内容;
# 签名块的事务所名与地址是名称, 不译.
# 占位符: {entity_name}, {period_end}, {auditor_name} (str.format); date 以 d 代日期 (str.format).
en:
  headings:  # ASA 700 第 23, 28 段; ASA 705 第 16, 20(a) 段
    unqualified:
      opinion: Opinion
      basis_for_opinion: Basis for Opinion
    qualified:
      opinion: Qualified Opinion
      basis_for_opinion: Basis for Qualified Opinion
  date: "{d.day} {d:%B %Y}"  # 如 30 June 2026
  terms:  # 照固定段落的写法 (撇号同正文为 ’)
    company: the Company
    directors: the directors
    financial_report: financial report
    auditors_report: auditor’s report
    auditor: auditor
    accounting_standards: Australian Accounting Standards
    auditing_standards: Australian Auditing Standards
    corporations_act: Corporations Act 2001
  sections:
    unqualified: &en
      directors_responsibilities: |
        Responsibilities of the Directors for the Financial Report

        The directors of the Company are responsible for the preparation of the financial report that gives a true and fair view in accordance with Australian Accounting Standards and the Corporations Act 2001 and for such internal control as the directors determine is necessary to enable the preparation of the financial report that gives a true and fair view and is free from material misstatement, whether due to fraud or error.

        In preparing the financial report, the directors are responsible for assessing the Company’s ability to continue as a going concern, disclosing, as applicable, matters related to going concern and using the going concern basis of accounting unless the directors either intend to liquidate the Company or to cease operations, or have no realistic alternative but to do so.
      auditor_responsibilities: |
        Auditor’s Responsibilities for the Audit of the Financial Report

        Our objectives are to obtain reasonable assurance about whether the financial report as a whole is free from material misstatement, whether due to fraud or error, and to issue an auditor’s report that includes our opinion. Reasonable assurance is a high level of assurance, but is not a guarantee that an audit conducted in accordance with the Australian Auditing Standards will always detect a material misstatement when it exists. Misstatements can arise from fraud or error and are considered material if, individually or in the aggregate, they could reasonably be expected to influence the economic decisions of users taken on the basis of this financial report.

        As part of an audit in accordance with the Australian Auditing Standards, we exercise professional judgement and maintain professional scepticism throughout the audit. We also:

        • Identify and assess the risks of material misstatement of the financial report, whether due to fraud or error, design and perform audit procedures responsive to those risks, and obtain audit evidence that is sufficient and appropriate to provide a basis for our opinion. The risk of not detecting a material misstatement resulting from fraud is higher than for one resulting from error, as fraud may involve collusion, forgery, intentional omissions, misrepresentations, or the override of internal control.

        • Obtain an understanding of internal control relevant to the audit in order to design audit procedures that are appropriate in the circumstances, but not for the purpose of expressing an opinion on the effectiveness of the Company’s internal control.

        • Evaluate the appropriateness of accounting policies used and the reasonableness of accounting estimates and related disclosures made by the directors.

        • Conclude on the appropriateness of the directors’ use of the going concern basis of accounting and, based on the audit evidence obtained, whether a material uncertainty exists related to events or conditions that may cast significant doubt on the Company’s ability to continue as a going concern. If we conclude that a material uncertainty exists, we are required to draw attention in our auditor’s report to the related disclosures in the financial report or, if such disclosures are inadequate, to modify our opinion. Our conclusions are based on the audit evidence obtained up to the date of our auditor’s report. However, future events or conditions may cause the Company to cease to continue as a going concern.

        • Evaluate the overall presentation, structure and content of the financial report, including the disclosures, and whether the financial report represents the underlying transactions and events in a manner that achieves fair presentation.

        We communicate with the directors regarding, among other matters, the planned scope and timing of the audit and significant audit findings, including any significant deficiencies in internal control that we identify during our audit.
      other_legal_and_regulatory: ""
      signature: |
        {auditor_name}
        Tessellate Audit Partners
        Level 9, 1 Illustration Place, Sydney NSW 2000
    qualified: *en
zh:
  headings:
    unqualified:
      opinion: 审计意见
      basis_for_opinion: 形成审计意见的基础
    qualified:
      opinion: 保留意见
      basis_for_opinion: 形成保留意见的基础
  date: "{d.year}年{d.month}月{d.day}日"  # 如 2026年6月30日
  terms:  # 照固定段落的写法, 键同 en
    company: 公司
    directors: 董事
    financial_report: 财务报告
    auditors_report: 审计报告
    auditor: 审计师
    accounting_standards: 澳大利亚会计准则
    auditing_standards: 澳大利亚审计准则
    corporations_act: 《2001年公司法》
  sections:
    unqualified: &zh
      directors_responsibilities: |
        董事对财务报告的责任

        公司董事负责按照澳大利亚会计准则和《2001年公司法》编制给出真实与公允反映的财务报告，并负责董事认为必要的内部控制，以使编制的财务报告给出真实与公允的反映，且不存在由于舞弊或错误导致的重大错报。

        在编制财务报告时，董事负责评估公司的持续经营能力，披露（如适用）与持续经营相关的事项，并运用持续经营会计基础，除非董事计划清算公司或停止营运，或者除此之外别无其他现实的选择。
      auditor_responsibilities: |
        审计师对财务报告审计的责任

        我们的目标是对财务报告整体是否不存在由于舞弊或错误导致的重大错报获取合理保证，并出具包含我们审计意见的审计报告。合理保证是高水平的保证，但并不能保证按照澳大利亚审计准则执行的审计在某一重大错报存在时总能发现。错报可能由于舞弊或错误导致，如果合理预期错报单独或汇总起来可能影响使用者依据本财务报告作出的经济决策，则错报被视为重大。

        在按照澳大利亚审计准则执行审计的过程中，我们运用职业判断，并在整个审计过程中保持职业怀疑。我们还：

        • 识别和评估由于舞弊或错误导致的财务报告重大错报风险，设计和实施应对这些风险的审计程序，并获取充分、适当的审计证据，为我们的审计意见提供基础。由于舞弊可能涉及串通、伪造、故意遗漏、虚假陈述或凌驾于内部控制之上，未能发现由于舞弊导致的重大错报的风险高于未能发现由于错误导致的重大错报的风险。

        • 了解与审计相关的内部控制，以设计在具体情况下恰当的审计程序，但目的并非对公司内部控制的有效性发表意见。

        • 评价所采用会计政策的恰当性，以及董事作出的会计估计及相关披露的合理性。

        • 对董事运用持续经营会计基础的恰当性得出结论，并根据获取的审计证据，就是否存在与可能导致对公司持续经营能力产生重大疑虑的事项或情况相关的重大不确定性得出结论。如果我们得出结论认为存在重大不确定性，我们须在审计报告中提请注意财务报告中的相关披露，或在披露不充分时修改我们的审计意见。我们的结论基于截至审计报告日获取的审计证据。然而，未来的事项或情况可能导致公司不再持续经营。

        • 评价财务报告的总体列报、结构和内容（包括披露），并评价财务报告是否以实现公允列报的方式反映相关交易和事项。

        我们与董事就计划的审计范围、时间安排和重大审计发现等事项进行沟通，包括我们在审计中识别出的值得治理层关注的内部控制缺陷。
      other_legal_and_regulatory: ""
      signature: |
        {auditor_name}
        Tessellate Audit Partners
        Level 9, 1 Illustration Place, Sydney NSW 2000
    qualified: *zh
