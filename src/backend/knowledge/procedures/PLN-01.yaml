id: PLN-01
name: 重要性水平
phase: P1_Planning
cycle: Planning
owner: A4
engine: manual
autonomy_level: L1
gate: PLN-01/03
params:
  candidates:
    - {basis: revenue, pct_low: 0.005, pct_high: 0.01}
    - {basis: total_assets, pct_low: 0.01, pct_high: 0.02}
    - {basis: profit_before_tax, pct_low: 0.05, pct_high: 0.05}
  performance_pct_range: [0.5, 0.75]
  clearly_trivial_pct: 0.05
  revenue_account_codes: ["4100"]
  income_tax_account_codes: ["8100"]
standards: [ASA320-P10, ASA320-P11, ASA450-P05]
rules:
  - id: M01
    name: 重要性基准取数
    severity: low
    emit: rows
    sql: |
      WITH balances AS (SELECT t.balance_cents, a.code, a.type FROM trial_balance t
       JOIN accounts a ON a.engagement_id=t.engagement_id AND a.code=t.account_code
       WHERE t.engagement_id=:eid AND t.period='current')
      SELECT 'revenue' AS basis, COALESCE(-SUM(balance_cents),0) AS base_amount_cents FROM balances WHERE code=ANY(:revenue_account_codes)
      UNION ALL SELECT 'total_assets', COALESCE(SUM(balance_cents),0) FROM balances WHERE type='asset'
      UNION ALL SELECT 'profit_before_tax', COALESCE(-SUM(balance_cents),0) FROM balances
       WHERE type IN ('revenue','expense') AND code<>ALL(:income_tax_account_codes)
      ORDER BY basis
