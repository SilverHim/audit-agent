standard: ASA 300
title: Planning an Audit of a Financial Report
compiled: "2023-12-14"   # Compilation Number 6
fragments:
  - id: ASA300-P07
    paragraph: "7"
    topic: overall_audit_strategy
    text: |
      The auditor shall establish an overall audit strategy that sets the scope, timing and direction of the audit, and that guides the development of the audit plan.
    procedures: [PLN-15]
  - id: ASA300-P09
    paragraph: "9"
    topic: audit_plan_contents
    text: |
      The auditor shall develop an audit plan that shall include a description of:
      (a) The nature, timing and extent of the planned direction and supervision of engagement team members and the review of their work.
      (b) The nature, timing and extent of planned risk assessment procedures, as determined under ASA 315.
      (c) The nature, timing and extent of planned further audit procedures at the assertion level, as determined under ASA 330.
      (d) Other planned audit procedures that are required to be carried out so that the engagement complies with the Australian Auditing Standards.
    procedures: [PLN-15]
  - id: ASA300-P13
    paragraph: "13"
    topic: initial_audit_activities
    text: |
      The auditor shall undertake the following activities prior to starting an initial audit:
      (a) Performing procedures required by ASA 220 regarding the acceptance of client relationships and audit engagements; and
      (b) Communicating with the predecessor auditor, where there has been a change of auditors, in compliance with relevant ethical requirements.
    procedures: [PLN-15]
