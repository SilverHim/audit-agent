id: CSH-02
name: 函证差异评价
phase: P2_Executing
cycle: Cash
owner: A6
engine: hybrid
autonomy_level: L3
assertions: [Existence]
triggers:
  - {account: Cash, assertions: [Existence], level: [medium, high, significant]}
params:
  period_end: {ref: period_end}
  subsequent_days: 10           # 期后流水范围
  lookback_days: 5              # 期末前总账分录范围
depends_on: [CSH-05, DOC-06]
standards: [ASA505-P14]
evidence_required: [external, bank]
