id: CSH-02
name: 函证差异评价
phase: P2_Executing
cycle: Cash
owner: A6
inputs: {tables: [bank_accounts, bank_transactions]}  # 执行前必须有的客户资料, 缺了等数据 (需求 R272)
outputs: [judgments, exceptions, review_tasks, confirmations]
reads: [bank_accounts, bank_transactions, journal_entries, trial_balance, confirmations]
engine: hybrid
autonomy_level: L3
always_review: true              # 函证差异一律由人评价 (ASA 505 para 14)
manual_result_allowed: true
assertions: [Existence]
triggers:
  - {account: Cash, assertions: [Existence], level: [medium, high, significant]}
params:
  period_end: {ref: period_end}
  subsequent_days: 10           # 期后流水范围
  lookback_days: 5              # 期末前总账分录范围
depends_on: [CSH-05, DOC-06]
standards: [ASA505-P14]
evidence_required: [external, bank]
# D01 回函与账面差额由 A6 在代码中生成, 不写 SQL (回函余额在 AuditOutputStore, 不经 FinancialDataStore.query 跨表读取):
#   对每个 Confirmation, book = FinancialDataStore.trial_balance(current) 中 gl_account_code 的余额;
#   confirmed_balance_cents ≠ book 时建 AuditException: id X-CSH-02-{run_no}-D01-{n}, rule_id D01, severity medium,
#   source_type bank_account, source_ids [bank_account_id], amount_cents = confirmed - book; Confirmation 写 book, difference, result = difference.
#   相等时 Confirmation 写 book, difference_cents = 0, result = agreed, 不调 LLM.
# 判断对象 = D01 例外的 source_id; D02, D03 的行按 bank_account_id 切给对应账户
rules:
  - id: D02
    name: 候选调节项：期后银行流水
    severity: low
    emit: rows
    sql: |
      SELECT 'bank_transaction' AS source_type, t.id, t.bank_account_id, t.txn_date,
             t.amount_cents, t.description, t.reference
      FROM bank_transactions t WHERE t.engagement_id=:eid AND t.txn_date>CAST(:period_end AS date)
        AND t.txn_date<=CAST(:period_end AS date)+CAST(:subsequent_days AS int)
      ORDER BY t.bank_account_id, t.txn_date, t.id
  - id: D03
    name: 候选调节项：期末前银行科目分录
    severity: low
    emit: rows
    sql: |
      SELECT 'journal_entry' AS source_type, j.id, b.id AS bank_account_id, j.entry_no,
             j.posting_date, j.debit_cents, j.credit_cents, j.description, j.source_doc
      FROM journal_entries j JOIN bank_accounts b ON b.engagement_id=j.engagement_id AND b.gl_account_code=j.account_code
      WHERE j.engagement_id=:eid
        AND j.posting_date BETWEEN CAST(:period_end AS date)-CAST(:lookback_days AS int) AND CAST(:period_end AS date)
      ORDER BY b.id, j.posting_date, j.id
llm:
  prompt: CSH-02.md.j2
  output_model: JudgmentDraft
  context_budget: 8000
