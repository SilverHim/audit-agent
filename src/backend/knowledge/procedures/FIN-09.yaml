id: FIN-09
name: 更正验证
workpaper: {ref: X-C, area: X}  # 底稿索引号与所属区 (需求 R329, knowledge/workpapers.yaml)
# 规格书 6.1.2 (FIN-09 在 FIN-08 与 GEN-05 增量之后), 7.2 (L2 混合), UC-06 第 3 步 (规则核对调整分录与错报, 大模型判断
# 是否完整更正及是否影响其他科目); ASA 450 第 7 段 (管理层按审计师要求更正后, 审计师执行追加程序确定是否仍有错报).
# 需求 R164 定模板, A8 的执行由 R165 加 (agents/workpaper.py, 口径见接口文档第 6 节 FIN-09 段).
# 判断对象是 verifying 的错报, 每条一个 (subject_id 为错报 ID); mock 的 fixture_key 取错报来源判断的 subject_id (同
# FIN-03, 如凭证号 XJ-499, 银行账户 BA-091, 科目代码). 规则 V01 取审计更正分录的全部行: 凭证号以 adjustment_prefix 开头
# (数据集声明, 缺省 "AJE-"; 按前缀比较, 不用 LIKE, 前缀中的 % 与 _ 不作通配符), 不看 is_adjustment (Xero 的手工分录
# is_adjustment 也为真). 按来源对象与科目匹配更正行, 算已更正额与剩余额在代码中做 (R165); 不写死科目代码.
# V02 分录与错报对不上由 A8 在代码中生成 (不写 SQL): 没有匹配行, 方向相反或超额 (已更正额不在 (0, 错报金额] 内) 时建
#   AuditException: id X-FIN-09-{run_no}-V02-{n} (n 在本次新建 V02 的错报中按判断对象的顺序从 1 编号), rule_id V02,
#   severity medium, source_ids 为匹配行 ID (没有时为来源对象), amount_cents 为错报金额, detail {misstatement_id,
#   expected_cents, corrected_cents, matched_line_ids}; 作该错报判断的规则例外, 验证载荷为 communicated 且须重新沟通.
#   该错报已有本程序尚未归因的 V02 时沿用, 不看本次比对, 不再新建 (同 CSH-02 的 D01, D04; 审核 R165-07).
# depends_on 只有 FIN-08 (R161 加 FIN-08.yaml 时补上); 分录段的 GEN-05 增量就绪后再加 GEN-05 (需求 R164 验收 1 的差异,
# 协调者 10-20 裁定).
phase: P3_Completion
cycle: Completion
owner: A8
feature: misstatement             # 功能开关 (services/features.py): 错报闭环
outputs: [judgments, exceptions, review_tasks, misstatements]
reads: [journal_entries, accounts]   # V01 的更正分录行与科目表
engine: hybrid
autonomy_level: L2
manual_result_allowed: true          # 判断失败的错报可由审计师给出验证结果 (须带人给的验证载荷)
misstatement_update_kind: verification   # 判断带验证载荷, 确认后写错报新版本; 推翻与手工结果须由人给载荷 (需求 R159);
                                         # 带它的程序自主度不能高于 L2 (仲裁不收载荷)
depends_on: [FIN-08]
params:
  adjustment_prefix: {ref: dataset.audit_adjustment_entry_prefix}   # 审计更正分录的凭证号前缀
standards: [ASA450-P07]
evidence_required: [voucher]
rules:
  - id: V01
    name: 审计更正分录的全部行
    severity: medium
    emit: rows
    sql: |
      SELECT 'journal_entry' AS source_type, j.id, j.entry_no, j.posting_date, j.account_code,
             a.name AS account_name, a.type AS account_type, a.category AS account_category,
             j.debit_cents, j.credit_cents, j.description, j.source_doc
      FROM journal_entries j
      LEFT JOIN accounts a ON a.engagement_id = j.engagement_id AND a.code = j.account_code
      WHERE j.engagement_id = :eid
        AND left(j.entry_no, length(CAST(:adjustment_prefix AS text))) = CAST(:adjustment_prefix AS text)
      ORDER BY j.entry_no, j.id
llm:
  prompt: FIN-09.md.j2
  output_model: CorrectionVerificationDraft
