id: CSH-05
name: 流水账面核对
phase: P2_Executing
cycle: Cash
owner: A6
inputs: {tables: [bank_accounts, bank_transactions]}  # 执行前必须有的客户资料, 缺了等数据 (需求 R272)
outputs: [exceptions]
reads: [bank_accounts, bank_transactions, trial_balance]
engine: rule
autonomy_level: L4
assertions: [Existence]
triggers:
  - {account: Cash, assertions: [Existence], level: [low, medium, high, significant]}
params:
  period_end: {ref: period_end}
rules:
  - id: B01
    name: 对账单期末余额与总账不符
    severity: medium
    sql: |
      SELECT 'bank_account' AS source_type, b.id AS source_id,
             s.balance_after_cents-t.balance_cents AS amount_cents,
             s.balance_after_cents AS statement_balance_cents, t.balance_cents AS book_balance_cents,
             s.id AS last_bank_transaction_id
      FROM bank_accounts b
      LEFT JOIN LATERAL (SELECT id, balance_after_cents FROM bank_transactions
        WHERE engagement_id=b.engagement_id AND bank_account_id=b.id AND txn_date<=CAST(:period_end AS date)
        ORDER BY txn_date DESC, id DESC LIMIT 1) s ON true
      LEFT JOIN trial_balance t ON t.engagement_id=b.engagement_id AND t.account_code=b.gl_account_code AND t.period='current'
      WHERE b.engagement_id=:eid AND (s.balance_after_cents IS NULL OR t.balance_cents IS NULL OR s.balance_after_cents<>t.balance_cents)
      ORDER BY b.id
